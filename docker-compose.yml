version: '3.3'

services:
  gameverse-next:
    container_name: gameverse-next
    restart: always
    image: node:20.20.2
    ports:
      - 4000:3000
    environment:
      - PORT=3000
    volumes:
      - ./:/usr/src/gameverse-next
    working_dir: /usr/src/gameverse-next

    networks:
      - client-network

    # FOR PRODUCTION
    command: bash -c "yarn && yarn run build && yarn run start"

networks:
  client-network:
    driver: bridge
